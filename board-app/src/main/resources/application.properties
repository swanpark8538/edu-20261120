server.port=8080

spring.main.allow-bean-definition-overriding=true

spring.jpa.open-in-view=false

# === DataSource 프로파일 ===
# 기본값: hsql (임베디드, 무설정) — 즉시 실행/테스트용
# 운영 DB 전환:
#   1) egovframework/egovProps/globals.properties 에서 해당 DB 섹션 주석 해제 및 값 입력
#   2) 아래 값을 oracle / mysql / maria / postgres / tibero / altibase / cubrid / goldilocks 로 변경
#   3) pom.xml 의 해당 JDBC 드라이버 의존성 주석 해제
#
# 로깅: log4j2.xml 의 baseline 은 INFO (운영 안전 default). hsql profile 에서만
# application-hsql.properties 가 logging.level.egovframework=DEBUG 등으로 끌어올립니다.
# 운영 profile 로 바꾸면 자동으로 INFO 로 떨어집니다.
spring.profiles.active=hsql

# globals.properties 로드 (파일이 없거나 비어 있어도 무시 — hsql 프로파일은 불필요)
spring.config.import=optional:classpath:/egovframework/egovProps/globals.properties

# === 세션 트래킹 ===
# URL 에 ;jsessionid=... 가 박히는 동작 비활성화 (cookie 만 사용).
# - jsessionid 가 매핑/리다이렉트를 깨는 함정 차단 (redirect 후 405 등)
# - 보안: jsessionid 가 referer/로그/북마크로 유출되는 경로 차단
server.servlet.session.tracking-modes=cookie

# === 보안 응답 헤더 (EgovConfigWebSecurity) ===
# 공통컴포넌트(security 방식) egov-security-config.properties 의
# sniff / xframeOptions / xssProtection / cacheControl 대응 항목.
# - sniff:          X-Content-Type-Options: nosniff
# - xframe-options: SAMEORIGIN | DENY | DISABLE(헤더 제거)
# - xss-protection: X-XSS-Protection (Spring Security 6 기본 "0")
# - cache-control:  캐시 금지 헤더 (true=활성 — 정방향 의미). 정적 리소스 핸들러가
#                   자체 Cache-Control 을 설정하므로 실효 범위는 동적 응답이다.
egov.security.headers.sniff=true
egov.security.headers.xframe-options=SAMEORIGIN
egov.security.headers.xss-protection=true
egov.security.headers.cache-control=true

# === CSRF 보호 (EgovConfigWebSecurity) ===
# 공통컴포넌트 egov-security-config.properties 의 csrf / csrfAccessDeniedUrl 대응.
# 화면 폼의 hidden 토큰과 meta 태그는 EgovCsrfControllerAdvice 가 노출하는
# ${_csrf} 로 채워진다. 토큰 검증 실패 시 아래 URL 로 포워드된다.
egov.security.csrf=true
egov.security.csrf-access-denied-url=/egovCSRFAccessDenied.do

# === CORS (EgovConfigWebSecurity) ===
# 공통컴포넌트(security 방식)는 CORS 설정이 없어 교차 출처 요청이 암묵 차단된다.
# 기본값(enabled=false)은 같은 자세 — 다른 출처의 프런트엔드/API 소비자가
# 필요할 때만 allowed-origins 에 출처를 나열하고 enabled=true 로 연다.
# 주의: allow-credentials=true 와 allowed-origins=* 조합은 Spring 이 거부한다.
egov.security.cors.enabled=false
egov.security.cors.allowed-origins=
egov.security.cors.allowed-methods=GET,POST
egov.security.cors.allowed-headers=*
egov.security.cors.allow-credentials=false
egov.security.cors.max-age=1800

# 인증 미도입 상태이므로 Spring Security 기본 계정 자동 생성(generated password 로그) 비활성.
# 인증 도입 시 이 exclude 를 제거하고 UserDetailsService 를 구성한다.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
