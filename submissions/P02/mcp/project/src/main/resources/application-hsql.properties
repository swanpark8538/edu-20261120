# =====================================================================
# 개발/테스트 (hsql) profile 전용 — 로깅 레벨 오버라이드
# =====================================================================
# 운영 profile (oracle, mysql, postgres, ...) 에서는 이 파일이 로드되지
# 않으므로 log4j2.xml 의 baseline (INFO) 이 그대로 유지됩니다.
#
# 운영에서 일시적으로 DEBUG 가 필요할 때는 파일을 만들지 말고 env var 로:
#   LOGGING_LEVEL_EGOVFRAMEWORK=DEBUG \
#   LOGGING_LEVEL_ORG_EGOVFRAME=DEBUG \
#   java -jar app.jar
# 또는 Spring Boot Actuator /loggers 엔드포인트로 무중단 전환하세요.
# =====================================================================

# 이 프로젝트는 내장 HSQL 이 실행 기본값이므로, 게시물 내용과 작성자가 SQL 파라미터 로그로
# 남지 않도록 INFO 를 유지한다. 개발 중 필요하면 위 환경변수 방식으로 DEBUG 를 켠다.
logging.level.egovframework=INFO
logging.level.org.egovframe=INFO
