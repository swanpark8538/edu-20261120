<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- th:object="${boardVO}" 가 지정된 form 안에서 사용한다. -->
<th:block th:fragment="fields">
    <div class="board-alert" role="alert" th:if="${#fields.hasGlobalErrors()}">
        <p th:each="message : ${#fields.globalErrors()}" th:text="${message}"></p>
    </div>

    <div class="fieldset">
        <div class="form-group">
            <div class="form-tit">
                <label for="title">제목 <span class="board-required">(필수)</span></label>
            </div>
            <div class="form-conts">
                <input type="text" class="krds-input" th:field="*{title}" th:errorclass="is-error" maxlength="200" required>
            </div>
            <p class="form-hint-invalid" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
        </div>

        <div class="form-group">
            <div class="form-tit">
                <label for="content">내용</label>
            </div>
            <div class="form-conts">
                <textarea class="krds-input board-textarea" th:field="*{content}" th:errorclass="is-error" maxlength="4000"></textarea>
            </div>
            <p class="form-hint-invalid" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></p>
        </div>

        <div class="form-group">
            <div class="form-tit">
                <label for="writer">작성자 <span class="board-required">(필수)</span></label>
            </div>
            <div class="form-conts">
                <input type="text" class="krds-input" th:field="*{writer}" th:errorclass="is-error" maxlength="50" required>
            </div>
            <p class="form-hint-invalid" th:if="${#fields.hasErrors('writer')}" th:errors="*{writer}"></p>
        </div>
    </div>
</th:block>

<div class="krds-file-upload line" th:fragment="upload">
    <div class="file-head">
        <h3 class="tit">파일 첨부</h3>
        <div>
            <p>파일당 10MB, 게시물당 10개까지 첨부할 수 있습니다. 허용 형식: txt, csv, pdf, hwp, hwpx, doc, docx, xls, xlsx, ppt, pptx, jpg, jpeg, png, gif, bmp, zip</p>
        </div>
    </div>
    <div class="file-upload">
        <p class="txt">첨부할 파일을 여기에 끌어다 놓거나, 파일 선택 버튼을 눌러 파일을 직접 선택해 주세요.</p>
        <div class="file-upload-btn-wrap">
            <input type="file" name="file_1" id="file_1" multiple hidden data-max-size="10485760">
            <button type="button" class="krds-btn medium"><i class="svg-icon ico-upload"></i>파일선택</button>
        </div>
    </div>
    <div class="file-list" id="selected-files" hidden>
        <ul class="upload-list"></ul>
    </div>
    <p class="form-hint-invalid" id="file-error" role="alert" hidden></p>
</div>

</body>
</html>
