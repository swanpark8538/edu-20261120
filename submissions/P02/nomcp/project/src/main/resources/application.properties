spring.application.name=board-app
server.port=8080

# Embedded HSQL (in-memory); tables are created at startup
spring.datasource.url=jdbc:hsqldb:mem:boarddb
spring.datasource.driver-class-name=org.hsqldb.jdbc.JDBCDriver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.encoding=UTF-8

# Upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-part-count=30
server.tomcat.max-swallow-size=100MB

# Session and error exposure
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-exception=false
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Web
spring.web.locale=ko
spring.web.locale-resolver=fixed
spring.web.resources.cache.period=3600
spring.thymeleaf.cache=true

# Application
Globals.pageUnit=10
Globals.pageSize=10
Globals.fileStorePath=${user.dir}/upload
Globals.fileAllowedExtensions=txt,csv,pdf,hwp,hwpx,doc,docx,xls,xlsx,ppt,pptx,jpg,jpeg,png,gif,bmp,zip
Globals.fileMaxCount=10
