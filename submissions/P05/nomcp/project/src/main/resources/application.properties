spring.application.name=board-app
server.port=8080

# Embedded in-memory HSQL
spring.datasource.url=jdbc:hsqldb:mem:boarddb
spring.datasource.driver-class-name=org.hsqldb.jdbc.JDBCDriver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.encoding=UTF-8

# Application messages plus the bundles eGovFrame runtime services resolve through messageSource
spring.messages.basename=egovframework/message/message-common,messages/message-common,org/egovframe/rte/fdl/idgnr/messages/idgnr,org/egovframe/rte/fdl/property/messages/properties
spring.messages.encoding=UTF-8

# Attachments (override with --Globals.fileStorePath=<path>)
Globals.fileStorePath=./upload
Globals.fileUpload.maxFileSize=10485760
Globals.fileUpload.maxFileCount=10
Globals.fileUpload.allowedExtensions=txt,csv,pdf,hwp,hwpx,doc,docx,xls,xlsx,ppt,pptx,jpg,jpeg,png,gif,bmp,zip

# Container limits sit above the per-file limit so the application can answer with a clear message
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
server.tomcat.max-swallow-size=100MB

# Do not expose internals on error responses
server.error.whitelabel.enabled=false
server.error.include-exception=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Session cookie. Set server.servlet.session.cookie.secure=true when served over HTTPS
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
