<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('오류')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: header}"></th:block>
<main id="container" class="board-inner board-main">
    <h1 class="board-title">요청을 처리할 수 없습니다</h1>
    <p th:text="${message != null and message != ''} ? ${message} : '입력한 내용을 확인한 뒤 다시 시도해 주세요.'">안내</p>
    <p th:if="${status != null}">오류 코드: <span th:text="${status}">500</span></p>
    <div class="board-actions">
        <a class="krds-btn medium secondary" th:href="@{/egovBoardList.do}">목록으로</a>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
