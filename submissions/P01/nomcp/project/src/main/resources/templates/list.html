<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('게시물 목록')}"></head>
<body>
<header th:replace="~{layout :: header}"></header>
<main id="main" class="inner main-content">
 <div class="breadcrumb"><a th:href="@{/}">홈</a><span aria-hidden="true"> / </span> 게시판</div>
 <div class="page-title"><span class="eyebrow">함께 나누는 이야기</span><h1>게시판</h1><p>궁금한 이야기와 유용한 자료를 자유롭게 나눠 주세요.</p></div>
 <p th:if="${message}" th:text="${message}" class="notice" role="status"></p>
 <form class="search-panel" th:action="@{/egovBoardList.do}" method="get" th:object="${search}">
  <div class="search-label">게시물 검색</div>
  <div class="search-controls">
   <div><label class="sr-only" for="searchCondition">검색 항목</label><select class="krds-form-select medium" id="searchCondition" th:field="*{searchCondition}"><option value="0">제목</option><option value="1">내용</option><option value="2">작성자</option></select></div>
   <div class="keyword"><label class="sr-only" for="searchKeyword">검색어</label><input class="krds-input medium" type="search" id="searchKeyword" th:field="*{searchKeyword}" maxlength="200" placeholder="검색어를 입력해 주세요"></div>
   <button type="submit" class="krds-btn medium">검색</button><a class="krds-btn medium tertiary" th:href="@{/egovBoardList.do}">초기화</a>
  </div>
 </form>
 <div class="list-toolbar"><p>전체 <strong th:text="${pagination.totalRecordCount}">0</strong>건 <span class="page-count" th:text="'· ' + ${pagination.currentPageNo} + '페이지'"></span></p><form method="post" th:action="@{/addBoardView.do}"><button class="krds-btn medium" type="submit">글쓰기 <span aria-hidden="true">＋</span></button></form></div>
 <div class="table-wrap"><table class="board-table"><caption class="sr-only">게시물 목록: 번호, 제목, 작성자, 등록일</caption><thead><tr><th scope="col" class="number">번호</th><th scope="col">제목</th><th scope="col" class="writer">작성자</th><th scope="col" class="date">등록일</th></tr></thead><tbody>
  <tr th:each="board,stat : ${boards}"><td class="number" th:text="${pagination.totalRecordCount - (search.pageIndex - 1) * 10 - stat.index}"></td><td class="title-cell"><a th:href="@{/boardDetail.do(boardId=${board.boardId})}" th:text="${board.title}"></a></td><td class="writer" th:text="${board.writer}"></td><td class="date" th:text="${#strings.substring(board.createdAt,0,10)}"></td></tr>
  <tr th:if="${#lists.isEmpty(boards)}"><td colspan="4"><div class="empty-state"><strong th:text="${#strings.isEmpty(search.searchKeyword) ? '아직 등록된 게시물이 없습니다.' : '검색 결과가 없습니다.'}"></strong><p th:text="${#strings.isEmpty(search.searchKeyword) ? '첫 번째 이야기를 남겨 주세요.' : '다른 검색어나 검색 항목으로 다시 찾아보세요.'}"></p></div></td></tr>
 </tbody></table></div>
 <nav class="pagination" aria-label="게시물 페이지" th:if="${pagination.totalRecordCount > 0}">
  <a th:if="${search.pageIndex > 1}" th:href="@{/egovBoardList.do(pageIndex=${search.pageIndex - 1},searchCondition=${search.searchCondition},searchKeyword=${search.searchKeyword})}" aria-label="이전 페이지">이전</a>
  <th:block th:each="n : ${#numbers.sequence(pagination.firstPageNoOnPageList,pagination.lastPageNoOnPageList)}"><a th:href="@{/egovBoardList.do(pageIndex=${n},searchCondition=${search.searchCondition},searchKeyword=${search.searchKeyword})}" th:text="${n}" th:classappend="${n == search.pageIndex} ? 'active'" th:attr="aria-current=${n == search.pageIndex ? 'page' : null},aria-label=${n + '페이지'}"></a></th:block>
  <a th:if="${search.pageIndex < pagination.totalPageCount}" th:href="@{/egovBoardList.do(pageIndex=${search.pageIndex + 1},searchCondition=${search.searchCondition},searchKeyword=${search.searchKeyword})}" aria-label="다음 페이지">다음</a>
 </nav>
</main>
<footer th:replace="~{layout :: footer}"></footer>
</body></html>
