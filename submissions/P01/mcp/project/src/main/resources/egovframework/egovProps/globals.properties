##############################################################################
# eGovFrame DataSource 설정 가이드 (globals.properties)
##############################################################################
# 본 파일은 운영 DB 연결 정보를 기록합니다.
# 기본 프로파일(hsql) 에서는 사용되지 않으므로 비워 두어도 동작합니다.
##############################################################################
# 보안 주의 — 운영 전환 전에 반드시 읽으세요
# ----------------------------------------------------------------------------
# 1. 본 파일에 평문 비밀번호를 직접 적어 소스 저장소에 커밋하지 마세요.
#    아래 모든 UserName/Password 항목은 Spring Boot 의 ${ENV:default} 문법으로
#    환경변수 주입을 받도록 작성되어 있습니다. env var 미설정 시 빈 문자열로
#    fail-fast 합니다 (잘못된 default credential 로 붙는 사고 방지).
#
# 2. 본 파일을 .gitignore 에 추가하고, 배포 환경에서는 CI/CD secret /
#    Kubernetes Secret / Vault 등의 외부 secret manager 로 주입하세요.
#
# 3. 비밀번호 보호 옵션 (택1)
#    (A) [권장] 환경변수 — 추가 의존성 없이 즉시 적용 가능
#        Globals.oracle.Password=${DB_ORACLE_PASSWORD:}
#        컨테이너 env / K8s Secret / CI secrets 로 주입
#
#    (B) eGovFrame Crypto Simplify — EgovPasswordResolver 빈 등록 후
#        Globals.oracle.Password=#{egovPasswordResolver.resolvePassword('Globals.oracle.Password')}
#        암호화된 값은 별도 keystore 또는 properties 에서 관리
#        참고: https://www.egovframe.go.kr/wiki/doku.php?id=egovframework:rte2:fdl:crypto_simplify_v3_8
#
#    (C) Vault / AWS Secrets Manager — Spring Cloud Vault 또는
#        spring-cloud-aws-secretsmanager-config 의존성 추가 시 자동 주입
##############################################################################
# 운영 DB 사용 절차
# ----------------------------------------------------------------------------
#   1) 사용할 DB 섹션의 주석(#) 을 해제 (UserName/Password 는 그대로 두면 env var 사용)
#   2) Url 의 host/port/sid 자리를 운영 값으로 수정 (또는 env var 로 감싸기)
#   3) application.properties 의 spring.profiles.active 변경 (예: oracle)
#   4) pom.xml 의 해당 JDBC 드라이버 의존성 주석 해제
#   5) 배포 환경에 DB_<vendor>_USER / DB_<vendor>_PASSWORD env var 주입
##############################################################################

