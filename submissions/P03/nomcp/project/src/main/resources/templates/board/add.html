<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>게시글 등록</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@korean-government/design-system@1.0.0/dist/css/krds.min.css" />
</head>
<body>
<div class="container">
    <h2>새 게시글 등록</h2>
    <form th:action="@{/addBoard.do}" method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label for="title">제목</label>
            <input type="text" class="form-control" id="title" name="title" required />
        </div>
        <div class="form-group">
            <label for="content">내용</label>
            <textarea class="form-control" id="content" name="content" rows="5"></textarea>
        </div>
        <div class="form-group">
            <label for="writer">작성자</label>
            <input type="text" class="form-control" id="writer" name="writer" required />
        </div>
        <div class="form-group">
            <label for="file_1">첨부파일</label>
            <input type="file" class="form-control" id="file_1" name="file_1" multiple />
        </div>
        <button type="submit" class="btn btn-primary">등록</button>
        <a th:href="@{/egovBoardList.do}" class="btn btn-secondary">목록</a>
    </form>
</div>
</body>
</html>
