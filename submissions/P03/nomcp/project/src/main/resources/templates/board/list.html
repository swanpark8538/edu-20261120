<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>게시판 목록</title>
    <!-- KRDS CSS (예시) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@korean-government/design-system@1.0.0/dist/css/krds.min.css" />
</head>
<body>
<div class="container">
    <h1>게시판</h1>
    <form th:action="@{/addBoardView.do}" method="post">
        <button type="submit" class="btn btn-primary">새 글 등록</button>
    </form>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>제목</th>
            <th>작성자</th>
            <th>작성일</th>
            <th>작업</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="board : ${page.content}">
            <td th:text="${board.title}"></td>
            <td th:text="${board.writer}"></td>
            <td><!-- placeholder for date -->-</td>
            <td>
                <form th:action="@{/updateBoardView.do}" method="post" style="display:inline;">
                    <input type="hidden" name="boardId" th:value="${board.boardId}" />
                    <button type="submit" class="btn btn-sm btn-secondary">수정</button>
                </form>
                <form th:action="@{/deleteBoard.do}" method="post" style="display:inline;" onsubmit="return confirm('삭제하시겠습니까?');">
                    <input type="hidden" name="boardId" th:value="${board.boardId}" />
                    <button type="submit" class="btn btn-sm btn-danger">삭제</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <div class="pagination">
        <ul class="pagination">
            <li class="page-item" th:classappend="${page.first}? 'disabled'">
                <a class="page-link" th:href="@{/egovBoardList.do(pageIndex=${page.number})}">Prev</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(1, page.totalPages)}" th:classappend="${i == page.number + 1}? 'active'">
                <a class="page-link" th:href="@{/egovBoardList.do(pageIndex=${i})}" th:text="${i}"></a>
            </li>
            <li class="page-item" th:classappend="${page.last}? 'disabled'">
                <a class="page-link" th:href="@{/egovBoardList.do(pageIndex=${page.number + 2})}">Next</a>
            </li>
        </ul>
    </div>
</div>
</body>
</html>
