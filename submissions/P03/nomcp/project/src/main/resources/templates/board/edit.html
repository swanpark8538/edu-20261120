<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>게시글 수정</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@korean-government/design-system@1.0.0/dist/css/krds.min.css" />
</head>
<body>
<div class="container">
    <h2>게시글 수정</h2>
    <form th:action="@{/updateBoard.do}" method="post" enctype="multipart/form-data">
        <input type="hidden" name="boardId" th:value="${board.boardId}" />
        <div class="form-group">
            <label for="title">제목</label>
            <input type="text" class="form-control" id="title" name="title" th:value="${board.title}" required />
        </div>
        <div class="form-group">
            <label for="content">내용</label>
            <textarea class="form-control" id="content" name="content" rows="5" th:text="${board.content}"></textarea>
        </div>
        <div class="form-group">
            <label for="writer">작성자</label>
            <input type="text" class="form-control" id="writer" name="writer" th:value="${board.writer}" required />
        </div>
        <div class="form-group">
            <label>기존 첨부파일</label>
            <ul>
                <li th:each="att : ${board.attachments}">
                    <a th:href="@{'/attachments/' + ${att.id}}" th:text="${att.fileName}"></a>
                </li>
            </ul>
        </div>
        <div class="form-group">
            <label for="file_1">추가 첨부파일</label>
            <input type="file" class="form-control" id="file_1" name="file_1" multiple />
        </div>
        <button type="submit" class="btn btn-primary">수정</button>
        <a th:href="@{/egovBoardList.do}" class="btn btn-secondary">목록</a>
    </form>
</div>
</body>
</html>
